# Private tmux server for editor cards: started with -L orch-nvim -f editor/tmux.conf, so nothing
# here touches the user's own tmux server, prefix or ~/.tmux.conf.

# No prefix: Ctrl+B is "toggle sidebar" and has to reach nvim.
set -g prefix None
set -g prefix2 None

set -g mouse on
set -g status off
set -s escape-time 0
set -g focus-events on
set -g history-limit 1000

# Truecolor (VS Code colours), and OSC 52 so a copy in nvim reaches the browser clipboard.
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:Tc,xterm-256color:Ms=\\E]52;%p1%s;%p2%s\\007"
set -s set-clipboard on

# nvim announces key style through its title; the dashboard reads it to decide who owns Ctrl+V.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
