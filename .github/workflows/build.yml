name: build binary

# Package the orchestrator for Windows so users can download and run it directly, with no Python
# install. It ships as a folder, zipped (see build.spec for why) — the .exe alone does not run.
# Linux and macOS run from source instead; nothing is published for them. Runs on: push of a v*
# tag (also cuts a release), push to master/gamedev, pull requests, or manual dispatch.
on:
  push:
    branches: [master, gamedev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # required to create the release on a tag push

jobs:
  build:
    runs-on: windows-2022     # a binary built here runs on Windows 10 and newer
    env:
      # The smoke test runs the .exe; the upload takes the whole folder. They are not the same
      # path: PyInstaller puts the program in _internal/ next to the .exe, so shipping the .exe
      # on its own ships something that cannot start.
      EXE: ./dist/agent-orch/agent-orch.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      # Fail EARLY: mcp 2.x dropped `mcp.server.fastmcp`, which every MCP server here imports.
      # Without this step the build still passes, the binary still ships, and it only dies at
      # serve time — five wasted minutes before you learn why.
      - name: Verify dependencies are usable
        run: python -c "from mcp.server.fastmcp import FastMCP; import uvicorn, starlette, httpx"

      # The dashboard is vanilla JS wired together by string ids and inline onclick attributes,
      # so a rename breaks it silently — the page still loads, the button just stops working.
      # Runs before the binary is even built.
      - name: Check the dashboard wiring
        # PYTHONUTF8=0 leaves Python on the Windows default of cp1252, so a file opened without
        # encoding="utf-8" fails here instead of on a user's machine — the UI sources carry
        # non-ASCII comments.
        env:
          PYTHONUTF8: "0"
        run: python static/orchestrator/check_ui.py

      # All seven fail loudly for bugs that are otherwise silent: a second copy of the module
      # splitting the in-memory state, the ping-pong cap refusing to lift, the editor card losing its
      # tmux wrapper (which silently turns every tab close into lost unsaved work), a
      # workspace move that lets two agents share one role name, an MCP server registration
      # that writes the user's config before proving the token works — or hands the token back out,
      # a Ctrl-C that parks forever because the dashboard's SSE stream never ends, and a slash
      # command wrapped in a role block, which reaches the CLI as plain text while the run is
      # still recorded ok.
      - name: Check orchestrator invariants
        env:
          PYTHONUTF8: "0"
        run: |
          python check_single_module.py
          python check_pair_cap.py
          python check_editor.py
          python check_workspace_move.py
          python check_mcp.py
          python check_shutdown.py
          python check_inject.py
          python check_images.py

      - name: Package
        run: pyinstaller build.spec --noconfirm --clean

      # Check the binary ACTUALLY runs, not just that it built. Without this, PyInstaller's most
      # common failure (a missing uvicorn hidden import) only shows up on a user's machine.
      - name: Smoke test binary
        shell: pwsh
        run: |
          # pwsh does NOT stop when a native command exits non-zero, so check it explicitly.
          # Without this line, a failing `init` lets the job continue and the real error surfaces
          # several steps later.
          & $env:EXE init
          if ($LASTEXITCODE -ne 0) { throw "init exited with code $LASTEXITCODE" }
          $env:ORCH_PORT = "8999"; $env:ORCH_HOST = "127.0.0.1"
          # Keep the logs so a dead serve says WHY, instead of just "could not connect".
          $p = Start-Process -PassThru -FilePath $env:EXE -ArgumentList serve `
                 -RedirectStandardOutput serve.log -RedirectStandardError serve.err
          $ok = $false
          foreach ($i in 1..40) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8999/health; $ok = $r.status -eq "ok"; break }
            catch {
              if ($p.HasExited) { Get-Content serve.log, serve.err; throw "serve died on startup" }
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $ok) { Get-Content serve.log, serve.err; throw "binary did not serve /health" }
          $spec = Invoke-RestMethod http://127.0.0.1:8999/openapi.json
          # The dashboard is data files, not code: PyInstaller drops it silently if build.spec
          # stops collecting it, and the binary still starts.
          $page = Invoke-WebRequest http://127.0.0.1:8999/
          # The ConPTY backend (pywinpty) is imported lazily inside the request handler, so a
          # missing bundle would otherwise only surface when a user opens a terminal.
          $h = Invoke-RestMethod http://127.0.0.1:8999/health
          # python-multipart is reached only inside starlette's form parser, so a bundle without
          # it still starts, and then /v1/images/edits fails with a 500 for every client. A form
          # with no image must get OUR 400, which proves the parser ran.
          $form = Invoke-WebRequest http://127.0.0.1:8999/v1/images/edits -Method Post `
                    -Form @{ prompt = "x" } -SkipHttpErrorCheck
          Stop-Process -Id $p.Id -Force
          if (-not $spec.paths.'/v1/chat/completions') { throw "/v1 missing from openapi" }
          if ($page.Content -notmatch '<title>') { throw "static dashboard missing from bundle" }
          if (-not $h.embedded_terminal) { throw "embedded terminal unavailable: $($h.embedded_terminal_reason)" }
          if ($form.StatusCode -ne 400 -or $form.Content -notmatch 'image') {
            throw "multipart form parsing missing from bundle: $($form.StatusCode) $($form.Content)"
          }

          # Double-click path: Explorer launches the .exe with NO arguments. Started life as an
          # argparse usage error that exited(2) and closed the window instantly, so guard it.
          $env:ORCH_PORT = "8998"
          $d = Start-Process -PassThru -FilePath $env:EXE `
                 -RedirectStandardOutput dbl.log -RedirectStandardError dbl.err
          $dblOk = $false
          foreach ($i in 1..40) {
            try { $dblOk = (Invoke-RestMethod http://127.0.0.1:8998/health).status -eq "ok"; break }
            catch {
              if ($d.HasExited) { Get-Content dbl.log, dbl.err; throw "no-argument launch exited immediately" }
              Start-Sleep -Milliseconds 500
            }
          }
          Stop-Process -Id $d.Id -Force
          if (-not $dblOk) { Get-Content dbl.log, dbl.err; throw "no-argument launch did not serve" }

      - uses: actions/upload-artifact@v4
        with:
          name: agent-orch-windows-x64
          path: dist/agent-orch
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }

      # Downloaded artifacts land in a subdirectory named after the artifact, so flatten them and
      # add a platform suffix to make it obvious which file belongs to which machine.
      - name: Collect files
        run: |
          set -euo pipefail
          mkdir -p out

          # Windows ships as a folder, so zip it. Two reasons, both about the warning that tells
          # people to delete the download: a bare .exe is what browser SmartScreen flags hardest,
          # and the folder is useless without _internal/ anyway. Zipping WITH the folder as the
          # top level means unzipping gives one tidy directory instead of spraying files into
          # Downloads.
          mkdir -p stage/agent-orch-windows-x64
          cp -r dist/agent-orch-windows-x64/. stage/agent-orch-windows-x64/
          test -f stage/agent-orch-windows-x64/agent-orch.exe
          test -d stage/agent-orch-windows-x64/_internal   # exe alone does not run
          (cd stage && zip -qr ../out/agent-orch-windows-x64.zip agent-orch-windows-x64)

          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Download

            | Machine | File |
            |---|---|
            | Windows 10/11 x64 | `agent-orch-windows-x64.zip` |

            Verify integrity with `SHA256SUMS.txt`. On Linux and macOS, run from source — see the
            readme.

            ## Run

            Unzip the archive and **double-click `agent-orch.exe`** inside the folder —
            no arguments needed. Keep the folder together: the `_internal` directory next to the
            `.exe` is the program, and the `.exe` will not start without it. The console window
            that opens is the server; close it to stop.

            Open `http://localhost:8992` (dashboard) or `http://localhost:8992/docs` (API).

            > **Security:** `ORCH_CORS_ORIGINS` defaults to `*` and there is no API key unless you
            > set one. Agents run shell commands with permissions bypassed, so that combination
            > lets any website you visit drive them. Set `ORCH_API_KEY` in a `.env` next to the
            > executable before using this on a shared or untrusted network.

            Configure via environment variables, or a `.env` file placed **next to the
            executable** (on Windows, inside the unzipped folder, beside `agent-orch.exe`).
            Notable ones: `ORCH_PORT`, `ORCH_HOST`, `ORCH_API_KEY` (enables auth on `/api` + `/v1`),
            `CLAUDE_BIN`, `ORCH_CODEX_BIN`.

            ## Prerequisites

            This binary is the orchestrator only — no agent is bundled. To run real agents the
            machine needs the `claude` CLI and/or the `codex` CLI, already logged in.

            ## Windows notes

            The dashboard's embedded terminal runs on ConPTY and needs Windows 10 1809 or newer;
            the bindings for it are bundled. `GET /health` reports `embedded_terminal`, with
            `embedded_terminal_reason` when it is unavailable.

            **If Windows warns you about the download.** These builds are not code-signed, so
            SmartScreen has no reputation for them and may offer to delete the file. Check the
            hash against `SHA256SUMS.txt` first, then clear the download mark:

            ```powershell
            Get-FileHash agent-orch-windows-x64.zip -Algorithm SHA256
            Unblock-File agent-orch-windows-x64.zip
            ```

            Unblock the `.zip` **before** extracting — the download mark is inherited by every
            file inside it.
