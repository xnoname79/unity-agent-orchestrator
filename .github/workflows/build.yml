name: build binary

# Package a single executable for Linux + Windows so users can download and run it directly,
# with no Python install. Runs on: push of a v* tag (also cuts a release), push to
# master/gamedev, pull requests, or manual dispatch.
on:
  push:
    branches: [master, gamedev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # required to create the release on a tag push

jobs:
  build:
    strategy:
      fail-fast: false   # if Windows breaks we still want to see the Linux build, and vice versa
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc = runs on more distros
            target: linux-x64
            binary: agent-orch
          - os: windows-2022      # Windows 10 can run a binary built here
            target: windows-x64
            binary: agent-orch.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      # Fail EARLY: mcp 2.x dropped `mcp.server.fastmcp`, which every MCP server here imports.
      # Without this step the build still passes, the binary still ships, and it only dies at
      # serve time — five wasted minutes before you learn why.
      - name: Verify dependencies are usable
        run: python -c "from mcp.server.fastmcp import FastMCP; import uvicorn, starlette, httpx"

      # The dashboard is vanilla JS wired together by string ids and inline onclick attributes,
      # so a rename breaks it silently — the page still loads, the button just stops working.
      # Cheap enough to run on both platforms; catches it before the binary is even built.
      - name: Check the dashboard wiring
        # LC_ALL=C + PYTHONUTF8=0 makes the Linux run open files under an ASCII locale, which is
        # what Windows does with cp1252. Without it a missing encoding="utf-8" only blows up in
        # the slower Windows job — the UI sources carry non-ASCII comments.
        env:
          LC_ALL: C
          PYTHONUTF8: "0"
        run: python static/orchestrator/check_ui.py

      # All four fail loudly for bugs that are otherwise silent: a second copy of the module
      # splitting the in-memory state, the ping-pong cap refusing to lift, the VS Code CLI spawned
      # in a way only Windows rejects (this runner is the only place that branch is real), and a
      # workspace move that lets two agents share one role name.
      - name: Check orchestrator invariants
        env:
          LC_ALL: C
          PYTHONUTF8: "0"
        run: |
          python check_single_module.py
          python check_pair_cap.py
          python check_vscode.py
          python check_workspace_move.py

      - name: Package
        run: pyinstaller build.spec --noconfirm --clean

      # Check the binary ACTUALLY runs, not just that it built. Without this, PyInstaller's most
      # common failure (a missing uvicorn hidden import) only shows up on a user's machine.
      - name: Smoke test binary (Linux)
        if: runner.os == 'Linux'
        run: |
          # PYTHONIOENCODING=cp1252 SIMULATES a Windows console on the Linux runner (cheap, and it
          # runs first): any print with non-ASCII characters raises UnicodeEncodeError and kills
          # the process if stdout/stderr were not forced to UTF-8. Caught here instead of waiting
          # for the Windows job.
          export PYTHONIOENCODING=cp1252
          ./dist/${{ matrix.binary }} init
          # Keep the child process log: if serve dies from a missing module this is the ONLY place
          # that says why — without it you just see a curl timeout and start guessing.
          ORCH_PORT=8999 ORCH_HOST=127.0.0.1 ./dist/${{ matrix.binary }} serve > serve.log 2>&1 &
          SRV=$!
          for i in $(seq 40); do
            curl -sf localhost:8999/health >/dev/null && break
            kill -0 $SRV 2>/dev/null || { echo "::error::serve died on startup"; cat serve.log; exit 1; }
            sleep 0.5
          done
          curl -sf localhost:8999/health | grep -q '"status":"ok"' || { cat serve.log; exit 1; }
          # Embedded terminal must be usable in the packaged binary. On Linux this only proves
          # the flag is wired; the Windows job is where it actually catches a missing pywinpty.
          curl -sf localhost:8999/health | grep -q '"embedded_terminal":true' \
            || { echo "::error::embedded terminal unavailable"; curl -s localhost:8999/health; exit 1; }
          curl -sf localhost:8999/openapi.json | grep -q '/v1/chat/completions'
          curl -sf localhost:8999/ | grep -q '<title>'          # static dashboard is in the bundle
          kill %1

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # pwsh does NOT stop when a native command exits non-zero, so check it explicitly.
          # Without this line, a failing `init` lets the job continue and the real error surfaces
          # several steps later.
          & ./dist/${{ matrix.binary }} init
          if ($LASTEXITCODE -ne 0) { throw "init exited with code $LASTEXITCODE" }
          $env:ORCH_PORT = "8999"; $env:ORCH_HOST = "127.0.0.1"
          # Keep the logs so a dead serve says WHY, instead of just "could not connect".
          $p = Start-Process -PassThru -FilePath ./dist/${{ matrix.binary }} -ArgumentList serve `
                 -RedirectStandardOutput serve.log -RedirectStandardError serve.err
          $ok = $false
          foreach ($i in 1..40) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8999/health; $ok = $r.status -eq "ok"; break }
            catch {
              if ($p.HasExited) { Get-Content serve.log, serve.err; throw "serve died on startup" }
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $ok) { Get-Content serve.log, serve.err; throw "binary did not serve /health" }
          $spec = Invoke-RestMethod http://127.0.0.1:8999/openapi.json
          # The ConPTY backend (pywinpty) is imported lazily inside the request handler, so a
          # missing bundle would otherwise only surface when a user opens a terminal.
          $h = Invoke-RestMethod http://127.0.0.1:8999/health
          Stop-Process -Id $p.Id -Force
          if (-not $spec.paths.'/v1/chat/completions') { throw "/v1 missing from openapi" }
          if (-not $h.embedded_terminal) { throw "embedded terminal unavailable: $($h.embedded_terminal_reason)" }

          # Double-click path: Explorer launches the .exe with NO arguments. Started life as an
          # argparse usage error that exited(2) and closed the window instantly, so guard it.
          $env:ORCH_PORT = "8998"
          $d = Start-Process -PassThru -FilePath ./dist/${{ matrix.binary }} `
                 -RedirectStandardOutput dbl.log -RedirectStandardError dbl.err
          $dblOk = $false
          foreach ($i in 1..40) {
            try { $dblOk = (Invoke-RestMethod http://127.0.0.1:8998/health).status -eq "ok"; break }
            catch {
              if ($d.HasExited) { Get-Content dbl.log, dbl.err; throw "no-argument launch exited immediately" }
              Start-Sleep -Milliseconds 500
            }
          }
          Stop-Process -Id $d.Id -Force
          if (-not $dblOk) { Get-Content dbl.log, dbl.err; throw "no-argument launch did not serve" }

      - uses: actions/upload-artifact@v4
        with:
          name: agent-orch-${{ matrix.target }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }

      # Downloaded artifacts land in a subdirectory named after the artifact, so flatten them and
      # add a platform suffix to make it obvious which file belongs to which machine.
      - name: Collect files
        run: |
          mkdir -p out
          cp dist/agent-orch-linux-x64/agent-orch      out/agent-orch-linux-x64
          cp dist/agent-orch-windows-x64/agent-orch.exe out/agent-orch-windows-x64.exe
          chmod +x out/agent-orch-linux-x64
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Download

            | Machine | File |
            |---|---|
            | Linux x64 | `agent-orch-linux-x64` |
            | Windows 10/11 x64 | `agent-orch-windows-x64.exe` |

            Verify integrity with `SHA256SUMS.txt`.

            ## Run

            ```bash
            chmod +x agent-orch-linux-x64
            ./agent-orch-linux-x64                # no argument = serve
            ```

            On Windows, **double-click `agent-orch-windows-x64.exe`** — no arguments needed. The
            console window that opens is the server; close it to stop.

            Open `http://localhost:8992` (dashboard) or `http://localhost:8992/docs` (API).

            > **Security:** `ORCH_CORS_ORIGINS` defaults to `*` and there is no API key unless you
            > set one. Agents run shell commands with permissions bypassed, so that combination
            > lets any website you visit drive them. Set `ORCH_API_KEY` in a `.env` next to the
            > executable before using this on a shared or untrusted network.

            Configure via environment variables, or a `.env` file placed **next to the
            executable**. Notable ones: `ORCH_PORT`, `ORCH_HOST`, `ORCH_API_KEY` (enables auth on
            `/api` + `/v1`), `CLAUDE_BIN`, `ORCH_CODEX_BIN`.

            ## Prerequisites

            This binary is the orchestrator only — no agent is bundled. To run real agents the
            machine needs the `claude` CLI and/or the `codex` CLI, already logged in.

            ## Windows notes

            The dashboard's embedded terminal runs on ConPTY and needs Windows 10 1809 or newer;
            the bindings for it are bundled in the `.exe`. `GET /health` reports
            `embedded_terminal`, with `embedded_terminal_reason` when it is unavailable.
